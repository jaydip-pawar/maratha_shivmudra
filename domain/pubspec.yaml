name: domain
description: "A new Flutter project."
version: 0.0.1
homepage:

environment:
  sdk: ^3.8.0
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter

  get_it: ^8.0.3
  injectable: ^3.0.0
  dart_mappable: ^4.8.0
  retrofit: ^4.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.4.15
  flutter_lints: ^5.0.0
  injectable_generator: ^3.1.0
  dart_mappable_builder: ^4.9.0

global_options:
  dart_mappable_builder:
    runs_before:
      - retrofit_generator
      - chopper_generator
      - json_serializable
      - injectable_generator
    options:
      renameMethods:
        fromJson: fromJsonString
        toJson: toJsonString
        fromMap: fromJson
        toMap: toJson   
